<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lumos Battery Test</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        .bateria {
            font-size: 50px;
            font-weight: bold;
            text-align: center;
        }

        .status {
            text-align: center;
            font-size: 20px;
            margin: 10px;
        }

        .previsao {
            text-align: center;
            margin-top: 25px;
        }

        .tempo {
            font-size: 28px;
            font-weight: bold;
        }

        .termino {
            margin-top: 10px;
            font-size: 18px;
        }

        .observacao {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        #historico {
            margin-top: 20px;
        }

        .registro {
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🔋 Lumos Battery</h1>


    <!-- ============================= -->
    <!-- STATUS DA BATERIA -->
    <!-- ============================= -->

    <div class="card">

        <div id="bateria" class="bateria">
            --%
        </div>

        <div id="status" class="status">
            Verificando...
        </div>

    </div>


    <!-- ============================= -->
    <!-- PREVISÃO -->
    <!-- ============================= -->

    <div class="card">

        <h2>⏱️ Previsão Lumos</h2>

        <div class="previsao">

            <div class="tempo" id="tempo">
                --
            </div>

            <div class="termino" id="termino">
                --
            </div>

        </div>


        <div class="observacao">

            A previsão utiliza a estimativa fornecida
            pelo dispositivo com uma margem de segurança
            de 20 minutos.

        </div>

    </div>


    <!-- ============================= -->
    <!-- SESSÃO -->
    <!-- ============================= -->

    <div class="card">

        <h2>📊 Sessão de carregamento</h2>

        <p>
            Início:
            <span id="inicio">--</span>
        </p>

        <button id="botao">
            Iniciar sessão
        </button>

        <div id="historico">

            <p>
                Nenhum registro ainda.
            </p>

        </div>

    </div>

</div>


<script>


// ========================================
// VARIÁVEIS
// ========================================

let bateria = null;

let sessaoAtiva = false;

let historico = [];

let ultimoPercentualRegistrado = null;

let intervalo = null;

let batteryManager = null;


// Margem adicionada pela Lumos

const MARGEM_MINUTOS = 20;


// ========================================
// ACESSAR BATTERY API
// ========================================

async function obterBateria() {

    // Verifica se o navegador suporta Battery API

    if (!("getBattery" in navigator)) {

        document.getElementById("status").innerText =
            "❌ Battery API não disponível.";

        return;

    }


    try {

        batteryManager =
            await navigator.getBattery();


        // Primeira atualização

        atualizarDados();


        // Quando o percentual mudar

        batteryManager.addEventListener(
            "levelchange",
            atualizarDados
        );


        // Quando começar/parar de carregar

        batteryManager.addEventListener(
            "chargingchange",
            atualizarDados
        );


        // Quando o tempo estimado mudar

        batteryManager.addEventListener(
            "chargingtimechange",
            atualizarDados
        );


    } catch (erro) {

        console.error(erro);

        document.getElementById("status").innerText =
            "❌ Erro ao acessar a bateria.";

    }

}


// ========================================
// ATUALIZAR DADOS
// ========================================

function atualizarDados() {

    if (!batteryManager) {
        return;
    }


    // Percentual

    bateria =
        Math.round(
            batteryManager.level * 100
        );


    // Status

    const carregando =
        batteryManager.charging;


    // Atualizar interface

    document.getElementById("bateria").innerText =
        bateria + "%";


    if (carregando) {

        document.getElementById("status").innerText =
            "⚡ Carregando";

    } else {

        document.getElementById("status").innerText =
            "🔋 Não está carregando";

    }


    // Atualizar previsão

    atualizarPrevisao();


    // Registrar histórico

    registrarMudanca();

}


// ========================================
// PREVISÃO LUMOS
// ========================================

function atualizarPrevisao() {

    if (!batteryManager) {
        return;
    }


    // Se não estiver carregando

    if (!batteryManager.charging) {

        document.getElementById("tempo").innerText =
            "Aguardando carregamento";

        document.getElementById("termino").innerText =
            "--";

        return;

    }


    // Tempo fornecido pela API

    const tempoAPI =
        batteryManager.chargingTime;


    // Infinity significa que o navegador
    // não conseguiu fornecer uma estimativa

    if (tempoAPI === Infinity) {

        document.getElementById("tempo").innerText =
            "Estimativa indisponível";

        document.getElementById("termino").innerText =
            "--";

        return;

    }


    // Converter segundos para minutos

    const minutosAPI =
        Math.ceil(tempoAPI / 60);


    // Adicionar margem Lumos

    const minutosMax =
        minutosAPI + MARGEM_MINUTOS;


    // Mostrar previsão

    document.getElementById("tempo").innerText =
        `${minutosAPI}–${minutosMax} minutos`;


    // ====================================
    // CALCULAR HORÁRIO DE TÉRMINO
    // ====================================

    const agora =
        new Date();


    const terminoMin =
        new Date(
            agora.getTime() +
            minutosAPI * 60 * 1000
        );


    const terminoMax =
        new Date(
            agora.getTime() +
            minutosMax * 60 * 1000
        );


    const horarioMin =
        terminoMin.toLocaleTimeString(
            "pt-BR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    const horarioMax =
        terminoMax.toLocaleTimeString(
            "pt-BR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    document.getElementById("termino").innerText =
        `Término estimado: ${horarioMin}–${horarioMax}`;

}


// ========================================
// REGISTRAR MUDANÇA DE BATERIA
// ========================================

function registrarMudanca() {

    // Só registra se houver sessão ativa

    if (!sessaoAtiva) {
        return;
    }


    // Evita registros repetidos

    if (
        ultimoPercentualRegistrado === bateria
    ) {

        return;

    }


    const agora =
        new Date();


    const horario =
        agora.toLocaleTimeString(
            "pt-BR"
        );


    const registro = {

        horario: horario,

        bateria: bateria

    };


    historico.push(registro);


    ultimoPercentualRegistrado =
        bateria;


    mostrarHistorico();

}


// ========================================
// MOSTRAR HISTÓRICO
// ========================================

function mostrarHistorico() {

    const elemento =
        document.getElementById("historico");


    elemento.innerHTML = "";


    historico.forEach(
        registro => {

            const linha =
                document.createElement("div");


            linha.classList.add(
                "registro"
            );


            linha.innerText =
                `${registro.horario} → ${registro.bateria}%`;


            elemento.appendChild(
                linha
            );

        }
    );

}


// ========================================
// INICIAR / FINALIZAR SESSÃO
// ========================================

function alternarSessao() {

    const botao =
        document.getElementById("botao");


    // ====================================
    // INICIAR
    // ====================================

    if (!sessaoAtiva) {

        sessaoAtiva = true;


        historico = [];


        ultimoPercentualRegistrado =
            null;


        const agora =
            new Date();


        document.getElementById("inicio").innerText =
            agora.toLocaleTimeString(
                "pt-BR"
            );


        botao.innerText =
            "Finalizar sessão";


        // Registrar estado inicial

        registrarMudanca();


    }


    // ====================================
    // FINALIZAR
    // ====================================

    else {

        sessaoAtiva = false;


        botao.innerText =
            "Iniciar nova sessão";

    }

}


// ========================================
// BOTÃO
// ========================================

document
    .getElementById("botao")
    .addEventListener(
        "click",
        alternarSessao
    );


// ========================================
// INICIAR
// ========================================

obterBateria();


</script>

</body>

</html>
